[project]
name = "amazon-mcp"
version = "0.1.0"
description = "Serveur MCP de scraping amazon.fr"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "requests>=2.32",
    "curl_cffi>=0.7",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amazon_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
